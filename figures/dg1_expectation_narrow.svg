font-size="12" class="dg-f-ink2 dg-text" text-anchor="middle">2019-20</text><text x="139.62" y="378.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">weight 0.8</text><circle cx="202.033" cy="123.252" r="7" class="dg-f-ink2"/><text x="191.033" y="128.252" font-size="12" class="dg-f-ink2 dg-text" text-anchor="end" font-weight="600">3.8</text><text x="202.033" y="362.95" font-size="12" class="dg-f-ink2 dg-text" text-anchor="middle">2020-21</text><text x="202.033" y="378.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">weight 1.0</text><text x="267.24" y="362.95" font-size="12" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">2021-22</text><text x="267.24" y="378.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">the season</text><line x1="212.033" y1="123.252" x2="203.24" y2="123.252" stroke-width="1" class="dg-s-ink3" stroke-dasharray="2 3"/><line x1="203.24" y1="123.252" x2="203.24" y2="278.912" stroke-width="2" class="dg-s-ink3" stroke-dasharray="3 3"/><line x1="249.24" y1="217.324" x2="285.24" y2="217.324" stroke-width="3" class="dg-s-nba"/><line x1="267.24" y1="217.324" x2="267.24" y2="278.912" stroke-width="3" class="dg-s-c8"/><circle cx="267.24" cy="278.912" r="7" class="dg-f-nba"/><text x="289.24" y="213.324" font-size="12" class="dg-f-nba dg-text" font-weight="700">expected</text><text x="289.24" y="228.324" font-size="12" class="dg-f-nba dg-text" font-weight="700">+1.81</text><text x="281.24" y="283.912" font-size="12" class="dg-f-ink dg-text" font-weight="700">actual 0.5</text><text x="259.24" y="252.118" font-size="12" class="dg-f-c8 dg-text" text-anchor="end" font-weight="700">−1.31</text><text x="197.24" y="173.95" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end" font-weight="600">−3.3</text><rect x="12" y="400.55" width="336" height="267.05" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><circle cx="32" cy="417.55" r="10" class="dg-f-ink3"/><text x="32" y="422.55" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">1</text><text x="48" y="422.55" font-size="13" class="dg-f-ink2 dg-text">Weight the three prior seasons by</text><text x="48" y="440.1" font-size="13" class="dg-f-ink2 dg-text">recency (0.6, 0.8, 1.0, oldest to</text><text x="48" y="457.65" font-size="13" class="dg-f-ink2 dg-text">newest) and by minutes.</text><circle cx="32" cy="482.2" r="10" class="dg-f-ink3"/><text x="32" y="487.2" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">2</text><text x="48" y="487.2" font-size="13" class="dg-f-ink2 dg-text">Pull that toward the league average by</text><text x="48" y="504.75" font-size="13" class="dg-f-ink2 dg-text">adding 500 minutes of an average season:</text><text x="48" y="522.3" font-size="13" class="dg-f-ink2 dg-text">+1.89.</text><circle cx="32" cy="546.85" r="10" class="dg-f-ink3"/><text x="32" y="551.85" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">3</text><text x="48" y="551.85" font-size="13" class="dg-f-ink2 dg-text">Add the league&#x27;s typical change at age</text><text x="48" y="569.4" font-size="13" class="dg-f-ink2 dg-text">27: −0.08. Expected: +1.81.</text><circle cx="32" cy="593.95" r="10" class="dg-f-nba"/><text x="32" y="598.95" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">4</text><text x="48" y="598.95" font-size="13" class="dg-f-ink dg-text" font-weight="600">Actual minus expected: 0.5 − 1.81 =</text><text x="48" y="616.5" font-size="13" class="dg-f-ink dg-text" font-weight="600">−1.31. This residual is what the study</text><text x="48" y="634.05" font-size="13" class="dg-f-ink dg-text" font-weight="600">compares.</text><text x="12" y="697.6" font-size="13" class="dg-f-ink2 dg-text">The naive change from the season before (−3.3)</text><text x="12" y="715.15" font-size="13" class="dg-f-ink2 dg-text">mixes in regression to the mean: a player&#x27;s</text><text x="12" y="732.7" font-size="13" class="dg-f-ink2 dg-text">best season is usually followed by a lower</text><text x="12" y="750.25" font-size="13" class="dg-f-ink2 dg-text">one. Against the expectation the drop is</text><text x="12" y="767.8" font-size="13" class="dg-f-ink2 dg-text">−1.31.</text></svg>
