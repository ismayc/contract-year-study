<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 484.3" role="img" aria-label="Which seasons feed which part of the study"><title>Which seasons feed which part of the study</title><defs><marker id="dg-arrow-b649e904d5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><line x1="12" y1="30" x2="748" y2="30" stroke-width="1.5" class="dg-s-ink3"/><circle cx="50" cy="30" r="5" class="dg-f-ink3"/><text x="50" y="16" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">t−3</text><line x1="50" y1="38" x2="50" y2="64" stroke-width="1" class="dg-s-rule" stroke-dasharray="2 3"/><circle cx="126" cy="30" r="5" class="dg-f-ink3"/><text x="126" y="16" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">t−2</text><line x1="126" y1="38" x2="126" y2="64" stroke-width="1" class="dg-s-rule" stroke-dasharray="2 3"/><circle cx="202" cy="30" r="5" class="dg-f-ink3"/><text x="202" y="16" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">t−1</text><line x1="202" y1="38" x2="202" y2="64" stroke-width="1" class="dg-s-rule" stroke-dasharray="2 3"/><circle cx="380" cy="30" r="7" class="dg-f-nba"/><text x="380" y="16" font-size="14" class="dg-f-nba dg-text" text-anchor="middle" font-weight="700">t</text><line x1="380" y1="38" x2="380" y2="64" stroke-width="1" class="dg-s-rule" stroke-dasharray="2 3"/><circle cx="634" cy="30" r="5" class="dg-f-ink3"/><text x="634" y="16" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">t+1</text><line x1="634" y1="38" x2="634" y2="64" stroke-width="1" class="dg-s-rule" stroke-dasharray="2 3"/><rect x="12" y="70" width="228" height="6" class="dg-f-ink3" rx="3"/><text x="24" y="100" font-size="18" class="dg-f-ink dg-display" font-weight="600">Seasons before</text><text x="24" y="119.6" font-size="14" class="dg-f-ink3 dg-text">t−3 to t−1</text><text x="24" y="145.6" font-size="14" class="dg-f-ink dg-text" font-weight="700">Expected BPM</text><text x="24" y="165.2" font-size="14" class="dg-f-ink2 dg-text">Prior seasons weighted</text><text x="24" y="184.1" font-size="14" class="dg-f-ink2 dg-text">0.6, 0.8, 1.0 (oldest to</text><text x="24" y="203" font-size="14" class="dg-f-ink2 dg-text">newest) and by minutes,</text><text x="24" y="221.9" font-size="14" class="dg-f-ink2 dg-text">pulled toward average by</text><text x="24" y="240.8" font-size="14" class="dg-f-ink2 dg-text">500 minutes, plus the age</text><text x="24" y="259.7" font-size="14" class="dg-f-ink2 dg-text">adjustment.</text><text x="24" y="289.7" font-size="14" class="dg-f-ink dg-text" font-weight="700">Tier</text><text x="24" y="309.3" font-size="14" class="dg-f-ink2 dg-text">Value over the two seasons</text><text x="24" y="328.2" font-size="14" class="dg-f-ink2 dg-text">before, ranked within the</text><text x="24" y="347.1" font-size="14" class="dg-f-ink2 dg-text">season:</text><rect x="24" y="359.1" width="18.4" height="18" class="dg-f-c4" rx="2" opacity="1.0"/><rect x="44.4" y="359.1" width="38.8" height="18" class="dg-f-c4" rx="2" opacity="0.45"/><rect x="85.2" y="359.1" width="79.6" height="18" class="dg-f-c3" rx="2" opacity="1.0"/><rect x="166.8" y="359.1" width="59.2" height="18" class="dg-f-ink3" rx="2" opacity="0.6"/><rect x="24" y="392.4" width="12" height="12" class="dg-f-c4" rx="2" opacity="1.0"/><text x="42" y="405.4" font-size="14" class="dg-f-ink dg-text">Stars: top 10%</text><rect x="24" y="412.7" width="12" height="12" class="dg-f-c4" rx="2" opacity="0.45"/><text x="42" y="425.7" font-size="14" class="dg-f-ink dg-text">Starters: next 20%</text><rect x="24" y="433" width="12" height="12" class="dg-f-c3" rx="2" opacity="1.0"/><text x="42" y="446" font-size="14" class="dg-f-ink dg-text" font-weight="600">Role players: middle 40%</text><rect x="24" y="453.3" width="12" height="12" class="dg-f-ink3" rx="2" opacity="0.6"/><text x="42" y="466.3" font-size="14" class="dg-f-ink dg-text">Fringe players: bottom 30%</text><line x1="244" y1="96" x2="253" y2="96" stroke-width="1.5" class="dg-s-ink3"/><path d="M262.0,96.0 L253.0,101.0 L253.0,91.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="266" y="70" width="228" height="6" class="dg-f-nba" rx="3"/><text x="278" y="100" font-size="18" class="dg-f-ink dg-display" font-weight="600">The season</text><text x="278" y="119.6" font-size="14" class="dg-f-ink3 dg-text">t: the test</text><text x="278" y="145.6" font-size="14" class="dg-f-ink dg-text" font-weight="700">Contract year: 2,921</text><text x="278" y="165.2" font-size="14" class="dg-f-ink2 dg-text">last season of a deal, the</text><text x="278" y="184.1" font-size="14" class="dg-f-ink2 dg-text">next not yet secured</text><text x="278" y="210.1" font-size="14" class="dg-f-ink dg-text" font-weight="700">Guaranteed year: 3,185</text><text x="278" y="229.7" font-size="14" class="dg-f-ink2 dg-text">the deal was certain to</text><text x="278" y="248.6" font-size="14" class="dg-f-ink2 dg-text">continue</text><text x="278" y="274.6" font-size="14" class="dg-f-ink dg-text" font-weight="700">The comparison</text><text x="278" y="294.2" font-size="14" class="dg-f-ink2 dg-text">Residual (actual minus</text><text x="278" y="313.1" font-size="14" class="dg-f-ink2 dg-text">expected BPM), contract</text><text x="278" y="332" font-size="14" class="dg-f-ink2 dg-text">year minus guaranteed</text><text x="278" y="350.9" font-size="14" class="dg-f-ink2 dg-text">year:</text><rect x="278" y="362.9" width="204" height="26" class="dg-f-c3" rx="13" opacity="0.9"/><text x="380" y="380.9" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">Role players +0.21</text><rect x="278" y="396.9" width="204" height="26" class="dg-f-c4" rx="13" opacity="0.9"/><text x="380" y="414.9" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">Stars −0.25</text><line x1="498" y1="96" x2="507" y2="96" stroke-width="1.5" class="dg-s-ink3"/><path d="M516.0,96.0 L507.0,101.0 L507.0,91.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="520" y="70" width="228" height="6" class="dg-f-ink3" rx="3"/><text x="532" y="100" font-size="18" class="dg-f-ink dg-display" font-weight="600">The season after</text><text x="532" y="119.6" font-size="14" class="dg-f-ink3 dg-text">t+1</text><text x="532" y="145.6" font-size="14" class="dg-f-ink dg-text" font-weight="700">Did they play again?</text><text x="532" y="165.2" font-size="14" class="dg-f-ink2 dg-text">20% of contract-year role</text><text x="532" y="184.1" font-size="14" class="dg-f-ink2 dg-text">players never played</text><text x="532" y="203" font-size="14" class="dg-f-ink2 dg-text">another NBA season (stars:</text><text x="532" y="221.9" font-size="14" class="dg-f-ink2 dg-text">10%).</text><text x="532" y="251.9" font-size="14" class="dg-f-ink dg-text" font-weight="700">Returners, next season</text><text x="532" y="271.5" font-size="14" class="dg-f-ink2 dg-text">Role players against</text><text x="532" y="290.4" font-size="14" class="dg-f-ink2 dg-text">expectation:</text><text x="532" y="314.4" font-size="16" class="dg-f-c3 dg-text" font-weight="700">−0.02</text><text x="584" y="314.4" font-size="14" class="dg-f-ink2 dg-text">after a contract year</text><text x="532" y="336.8" font-size="16" class="dg-f-ink3 dg-text" font-weight="700">+0.11</text><text x="584" y="336.8" font-size="14" class="dg-f-ink2 dg-text">after a guaranteed year</text></svg>
