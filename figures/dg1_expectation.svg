<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 534.25" role="img" aria-label="How one season is scored: Julius Randle, 2021-22"><title>How one season is scored: Julius Randle, 2021-22</title><defs><marker id="dg-arrow-4a9c0f226f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">Scoring one season: Julius Randle, 2021-22</text><rect x="46" y="72" width="420" height="270" class="dg-f-surface2" rx="6"/><line x1="46" y1="296.151" x2="466" y2="296.151" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 4"/><text x="52" y="290.151" font-size="14" class="dg-f-ink3 dg-text">league average (0)</text><text x="40" y="300.151" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">0</text><text x="40" y="249.208" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">1</text><text x="40" y="198.264" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">2</text><text x="40" y="147.321" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">3</text><text x="40" y="96.3774" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">4</text><text x="12" y="64" font-size="14" class="dg-f-ink2 dg-text">BPM</text><circle cx="89.4" cy="219.736" r="7" class="dg-f-ink2"/><text x="100.4" y="224.736" font-size="14" class="dg-f-ink2 dg-text" font-weight="600">1.5</text><text x="89.4" y="360" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">2018-19</text><text x="89.4" y="378.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">weight 0.6</text><circle cx="176.2" cy="311.434" r="7" class="dg-f-ink2"/><text x="187.2" y="316.434" font-size="14" class="dg-f-ink2 dg-text" font-weight="600">−0.3</text><text x="176.2" y="360" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">2019-20</text><text x="176.2" y="378.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">weight 0.8</text><circle cx="263" cy="102.566" r="7" class="dg-f-ink2"/><text x="252" y="107.566" font-size="14" class="dg-f-ink2 dg-text" text-anchor="end" font-weight="600">3.8</text><text x="263" y="360" font-size="14" class="dg-f-ink2 dg-text" text-anchor="middle">2020-21</text><text x="263" y="378.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">weight 1.0</text><text x="340.4" y="360" font-size="14" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">2021-22</text><text x="340.4" y="378.2" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle">the season</text><line x1="273" y1="102.566" x2="276.4" y2="102.566" stroke-width="1" class="dg-s-ink3" stroke-dasharray="2 3"/><line x1="276.4" y1="102.566" x2="276.4" y2="270.679" stroke-width="2" class="dg-s-ink3" stroke-dasharray="3 3"/><line x1="322.4" y1="204.164" x2="358.4" y2="204.164" stroke-width="3" class="dg-s-nba"/><line x1="340.4" y1="204.164" x2="340.4" y2="270.679" stroke-width="3" class="dg-s-c8"/><circle cx="340.4" cy="270.679" r="7" class="dg-f-nba"/><text x="362.4" y="200.164" font-size="14" class="dg-f-nba dg-text" font-weight="700">expected</text><text x="362.4" y="217.664" font-size="14" class="dg-f-nba dg-text" font-weight="700">+1.81</text><text x="354.4" y="275.679" font-size="14" class="dg-f-ink dg-text" font-weight="700">actual 0.5</text><text x="332.4" y="241.421" font-size="14" class="dg-f-c8 dg-text" text-anchor="end" font-weight="700">−1.31</text><text x="270.4" y="157" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end" font-weight="600">−3.3</text><rect x="488" y="72" width="260" height="377.75" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><circle cx="508" cy="89" r="10" class="dg-f-ink3"/><text x="508" y="94" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">1</text><text x="524" y="94" font-size="15" class="dg-f-ink2 dg-text">Weight the three prior</text><text x="524" y="114.25" font-size="15" class="dg-f-ink2 dg-text">seasons by recency (0.6,</text><text x="524" y="134.5" font-size="15" class="dg-f-ink2 dg-text">0.8, 1.0, oldest to</text><text x="524" y="154.75" font-size="15" class="dg-f-ink2 dg-text">newest) and by minutes.</text><circle cx="508" cy="182" r="10" class="dg-f-ink3"/><text x="508" y="187" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">2</text><text x="524" y="187" font-size="15" class="dg-f-ink2 dg-text">Pull that toward the</text><text x="524" y="207.25" font-size="15" class="dg-f-ink2 dg-text">league average by adding</text><text x="524" y="227.5" font-size="15" class="dg-f-ink2 dg-text">500 minutes of an average</text><text x="524" y="247.75" font-size="15" class="dg-f-ink2 dg-text">season: +1.89.</text><circle cx="508" cy="275" r="10" class="dg-f-ink3"/><text x="508" y="280" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">3</text><text x="524" y="280" font-size="15" class="dg-f-ink2 dg-text">Add the league&#x27;s typical</text><text x="524" y="300.25" font-size="15" class="dg-f-ink2 dg-text">change at age 27: −0.08.</text><text x="524" y="320.5" font-size="15" class="dg-f-ink2 dg-text">Expected: +1.81.</text><circle cx="508" cy="347.75" r="10" class="dg-f-nba"/><text x="508" y="352.75" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">4</text><text x="524" y="352.75" font-size="15" class="dg-f-ink dg-text" font-weight="600">Actual minus expected:</text><text x="524" y="373" font-size="15" class="dg-f-ink dg-text" font-weight="600">0.5 − 1.81 = −1.31. This</text><text x="524" y="393.25" font-size="15" class="dg-f-ink dg-text" font-weight="600">residual is what the</text><text x="524" y="413.5" font-size="15" class="dg-f-ink dg-text" font-weight="600">study compares.</text><text x="12" y="479.75" font-size="15" class="dg-f-ink2 dg-text">The naive change from the season before (−3.3) mixes in regression to the mean: a</text><text x="12" y="500" font-size="15" class="dg-f-ink2 dg-text">player&#x27;s best season is usually followed by a lower one. Against the expectation the drop</text><text x="12" y="520.25" font-size="15" class="dg-f-ink2 dg-text">is −1.31.</text></svg>
