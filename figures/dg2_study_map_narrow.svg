<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 917.2" role="img" aria-label="Which seasons feed which part of the study"><title>Which seasons feed which part of the study</title><defs><marker id="dg-arrow-bf921d04bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="336" height="6" class="dg-f-ink3" rx="3"/><text x="24" y="44" font-size="16" class="dg-f-ink dg-display" font-weight="600">Seasons before</text><text x="24" y="60.8" font-size="12" class="dg-f-ink3 dg-text">t−3 to t−1</text><text x="24" y="86.8" font-size="13" class="dg-f-ink dg-text" font-weight="700">Expected BPM</text><text x="24" y="105" font-size="12" class="dg-f-ink2 dg-text">Prior seasons weighted 0.6, 0.8, 1.0 (oldest to</text><text x="24" y="121.2" font-size="12" class="dg-f-ink2 dg-text">newest) and by minutes, pulled toward average</text><text x="24" y="137.4" font-size="12" class="dg-f-ink2 dg-text">by 500 minutes, plus the age adjustment.</text><text x="24" y="167.4" font-size="13" class="dg-f-ink dg-text" font-weight="700">Tier</text><text x="24" y="185.6" font-size="12" class="dg-f-ink2 dg-text">Value over the two seasons before, ranked</text><text x="24" y="201.8" font-size="12" class="dg-f-ink2 dg-text">within the season:</text><rect x="24" y="213.8" width="29.2" height="18" class="dg-f-c4" rx="2" opacity="1.0"/><rect x="55.2" y="213.8" width="60.4" height="18" class="dg-f-c4" rx="2" opacity="0.45"/><rect x="117.6" y="213.8" width="122.8" height="18" class="dg-f-c3" rx="2" opacity="1.0"/><rect x="242.4" y="213.8" width="91.6" height="18" class="dg-f-ink3" rx="2" opacity="0.6"/><rect x="24" y="246.2" width="12" height="12" class="dg-f-c4" rx="2" opacity="1.0"/><text x="42" y="257.2" font-size="12" class="dg-f-ink dg-text">Stars: top 10%</text><rect x="24" y="263.6" width="12" height="12" class="dg-f-c4" rx="2" opacity="0.45"/><text x="42" y="274.6" font-size="12" class="dg-f-ink dg-text">Starters: next 20%</text><rect x="24" y="281" width="12" height="12" class="dg-f-c3" rx="2" opacity="1.0"/><text x="42" y="292" font-size="12" class="dg-f-ink dg-text" font-weight="600">Role players: middle 40%</text><rect x="24" y="298.4" width="12" height="12" class="dg-f-ink3" rx="2" opacity="0.6"/><text x="42" y="309.4" font-size="12" class="dg-f-ink dg-text">Fringe players: bottom 30%</text><line x1="180" y1="323.4" x2="180" y2="340.4" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,349.4 L175.0,340.4 L185.0,340.4 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="361.4" width="336" height="6" class="dg-f-nba" rx="3"/><text x="24" y="391.4" font-size="16" class="dg-f-ink dg-display" font-weight="600">The season</text><text x="24" y="408.2" font-size="12" class="dg-f-ink3 dg-text">t: the test</text><text x="24" y="434.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">Contract year: 2,921</text><text x="24" y="452.4" font-size="12" class="dg-f-ink2 dg-text">last season of a deal, the next not yet secured</text><text x="24" y="478.4" font-size="13" class="dg-f-ink dg-text" font-weight="700">Guaranteed year: 3,185</text><text x="24" y="496.6" font-size="12" class="dg-f-ink2 dg-text">the deal was certain to continue</text><text x="24" y="522.6" font-size="13" class="dg-f-ink dg-text" font-weight="700">The comparison</text><text x="24" y="540.8" font-size="12" class="dg-f-ink2 dg-text">Residual (actual minus expected BPM), contract</text><text x="24" y="557" font-size="12" class="dg-f-ink2 dg-text">year minus guaranteed year:</text><rect x="24" y="569" width="312" height="26" class="dg-f-c3" rx="13" opacity="0.9"/><text x="180" y="587" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">Role players +0.21</text><rect x="24" y="603" width="312" height="26" class="dg-f-c4" rx="13" opacity="0.9"/><text x="180" y="621" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">Stars −0.25</text><line x1="180" y1="643" x2="180" y2="660" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,669.0 L175.0,660.0 L185.0,660.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="681" width="336" height="6" class="dg-f-ink3" rx="3"/><text x="24" y="711" font-size="16" class="dg-f-ink dg-display" font-weight="600">The season after</text><text x="24" y="727.8" font-size="12" class="dg-f-ink3 dg-text">t+1</text><text x="24" y="753.8" font-size="13" class="dg-f-ink dg-text" font-weight="700">Did they play again?</text><text x="24" y="772" font-size="12" class="dg-f-ink2 dg-text">20% of contract-year role players never played</text><text x="24" y="788.2" font-size="12" class="dg-f-ink2 dg-text">another NBA season (stars: 10%).</text><text x="24" y="818.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">Returners, next season</text><text x="24" y="836.4" font-size="12" class="dg-f-ink2 dg-text">Role players against expectation:</text><text x="24" y="860.4" font-size="15" class="dg-f-c3 dg-text" font-weight="700">−0.02</text><text x="76" y="860.4" font-size="12" class="dg-f-ink2 dg-text">after a contract year</text><text x="24" y="881.2" font-size="15" class="dg-f-ink3 dg-text" font-weight="700">+0.11</text><text x="76" y="881.2" font-size="12" class="dg-f-ink2 dg-text">after a guaranteed year</text></svg>
